<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataGuard</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><p class="eyebrow">DATA QUALITY</p><h1>DataGuard</h1><p>CSV 데이터 품질을 진단하고 이상치를 탐지합니다.</p></div><form id="upload-form"><label class="drop"><input id="file" type="file" accept=".csv,text/csv" required><span id="file-name">CSV 파일을 선택하세요</span><small>UTF-8 · 최대 5MB · 최대 20,000행</small></label><button type="submit">분석 시작</button></form></header><div id="message" class="message hidden"></div><section id="results" class="hidden"><div class="quality-summary"><div><small>데이터 품질 점수</small><strong id="quality-score">-</strong><span> / 100</span></div><div><small>결측치 비율</small><strong id="missing-rate">-</strong></div><div><small>중복 행 비율</small><strong id="duplicate-rate">-</strong></div><div><small>이상치 비율</small><strong id="quality-anomaly-rate">-</strong></div></div><div class="cards"><article><small>전체 행</small><strong id="rows">-</strong></article><article><small>전체 컬럼</small><strong id="columns">-</strong></article><article><small>중복 행</small><strong id="duplicates">-</strong></article><article class="accent"><small>이상치</small><strong id="anomalies">-</strong><span id="anomaly-rate"></span></article></div><div class="grid"><section class="panel"><h2>컬럼 정보</h2><div id="types"></div></section><section class="panel"><h2>결측치 현황</h2><div id="missing"></div></section></div><section class="panel"><h2>수치형 통계</h2><div id="stats"></div></section><section class="panel"><h2>데이터 미리보기</h2><div class="table-wrap"><table id="preview"></table></div></section></section></main><script src="/static/app.js"></script></body></html>
