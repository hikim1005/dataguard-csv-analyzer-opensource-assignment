name: DataGuard CI

on:
  push:
    branches:
      - main

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dataguard-csv-analyzer:latest

      - name: Start FastAPI container
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dataguard-csv-analyzer:latest
          docker run -d --name dataguard-test -p 8000:8000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/dataguard-csv-analyzer:latest

      - name: Check FastAPI service
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/ > /dev/null; then
              echo "FastAPI service started successfully."
              exit 0
            fi
            sleep 2
          done
          docker logs dataguard-test
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm --force dataguard-test
