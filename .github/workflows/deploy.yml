name: DataGuard Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy latest container
        shell: pwsh
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/dataguard-csv-analyzer:latest
        run: |
          Write-Host "Pull latest Docker image"
          docker pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

          Write-Host "Remove existing containers"
          docker rm -f dataguard 2>$null
          docker rm -f dataguard-test 2>$null
          $global:LASTEXITCODE = 0

          Write-Host "Start new DataGuard container"
          docker run -d --name dataguard -p 8000:8000 $env:IMAGE
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      - name: Check deployed service
        shell: pwsh
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:8000/" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                Write-Host "DataGuard service is running."
                exit 0
              }
            }
            catch {
              Write-Host "Waiting for DataGuard service..."
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "DataGuard service did not respond."
          docker logs dataguard
          exit 1

      - name: Show container logs on failure
        if: failure()
        shell: pwsh
        run: |
          docker logs dataguard 2>$null
          exit 0
